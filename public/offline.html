<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ઑફલાઇન — પુષ્ટિ સાહિત્ય</title>
  <meta name="robots" content="noindex">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#ffd200;background-image:radial-gradient(#0d0b09 1.6px,transparent 1.6px);background-size:9px 9px;font-family:system-ui,-apple-system,sans-serif;color:#0d0b09;text-align:center;padding:1.5rem}
    .box{background:#fff;border:4px solid #000;box-shadow:8px 8px 0 #000;padding:2rem 1.75rem;max-width:22rem;width:100%}
    h1{font-size:1.35rem;margin-bottom:.75rem;line-height:1.35}
    p{font-size:1rem;margin-bottom:1.5rem;line-height:1.5}
    a.btn{display:inline-block;background:#ff6d00;color:#000;font-weight:700;text-decoration:none;padding:.7rem 1.6rem;border:3px solid #000;box-shadow:4px 4px 0 #000;letter-spacing:.04em}
    a.btn:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 #000}
    a.btn:active{transform:translate(4px,4px);box-shadow:0 0 0 #000}
  </style>
</head>
<body>
  <div class="box">
    <h1>ઈન્ટરનેટ ધીમું છે,<br>કૃપા કરીને ફરી પ્રયાસ કરો</h1>
    <p>Internet slow, please retry</p>
    <a class="btn" href="/">ફરી પ્રયાસ / Retry</a>
  </div>
</body>
</html>
